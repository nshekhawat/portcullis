services:
  portcullis:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/nshekhawat/portcullis:local
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - CONFIG_PATH=/config/config.yaml
      - PORTCULLIS_STORAGE_BACKEND=redis
      - PORTCULLIS_REDIS_ADDRESS=redis:6379
      - PORTCULLIS_ADMIN_TOKENS=local-admin-token
    volumes:
      - ./config.yaml.example:/config/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/portcullis", "healthcheck", "--url", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
