apiVersion: v1
kind: Service
metadata:
  name: portcullis
  labels:
    app: portcullis
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
  selector:
    app: portcullis
---
apiVersion: v1
kind: Service
metadata:
  name: portcullis-headless
  labels:
    app: portcullis
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
  selector:
    app: portcullis
