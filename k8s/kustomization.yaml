apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - redis.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: portcullis
      app.kubernetes.io/component: rate-limiting

images:
  - name: portcullis
    newName: ghcr.io/nshekhawat/portcullis
    newTag: 0.1.0
