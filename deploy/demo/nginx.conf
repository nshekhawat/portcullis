# Round-robins the two gateway replicas.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    # Keep the client address visible to the gateway, which trusts the compose
    # network and resolves the original client from X-Forwarded-For.
    log_format demo '$remote_addr -> $upstream_addr $request $status';

    upstream portcullis {
        server gateway-a:8000;
        server gateway-b:8000;
    }

    server {
        listen 8000;
        access_log /dev/stdout demo;

        location / {
            proxy_pass http://portcullis;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
